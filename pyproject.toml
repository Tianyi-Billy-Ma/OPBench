[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opbench"
version = "0.1.0"
description = "OPBench: A Graph Benchmark to Combat the Opioid Crisis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Tianyi Ma"},
]
keywords = [
    "graph neural networks",
    "opioid crisis",
    "benchmark",
    "hypergraph",
    "heterogeneous graph",
    "drug detection",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "pytorch-lightning>=2.0.0",
    "torch-geometric>=2.4.0",
    "wandb>=0.16.0",
    "omegaconf>=2.3.0",
    "pyyaml>=6.0",
    "seaborn>=0.13.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "simple-parsing>=0.1.0",
    "litlogger>=0.1.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/Tianyi-Billy-Ma/OPBench"
Repository = "https://github.com/Tianyi-Billy-Ma/OPBench"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.uv]
